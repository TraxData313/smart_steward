<!DOCTYPE html>
<!--
  The Steam Workshop preview (1024 x 1024), in the house style of the sibling mods (TrainingBattles, Better Skirmisher
  Separation): gold frame, Palatino small caps title over a dark fade, one tagline. The art is the REAL Party Steward
  window (Screenshots\01_suggestion_food.jpg, cropped by the script to title, tabs, Denari and the Food rows).
  Rendered by:  python tools\make_thumbnail.py      (writes Screenshots\preview_thumbnail.jpg, under Steam's 1 MB)
  ART_IMG is replaced by the script with the cropped panel's file URI.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: #0d0a07; }
  .canvas {
    position: relative; width: 1024px; height: 1024px; background: #0d0a07;
    font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  }
  .art {
    position: absolute; left: 34px; top: 34px; width: 956px; height: 618px; border-radius: 16px 16px 0 0;
    background: url('ART_IMG') center top / 956px 618px no-repeat;
    filter: brightness(1.12) contrast(1.06);
  }
  .shade {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 120% 90% at 50% 30%, rgba(0,0,0,0) 50%, rgba(13,10,7,0.5) 85%, rgba(13,10,7,0.85) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 49%, rgba(13,10,7,0.8) 53%, rgba(13,10,7,1) 56%);
  }
  .frame {
    position: absolute; inset: 22px;
    border: 3px solid rgba(214, 178, 94, 0.85); border-radius: 26px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.35);
  }
  .titleblock { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; }
  .ornament { color: #d6b25e; font-size: 26px; letter-spacing: 14px; text-shadow: 0 2px 6px rgba(0,0,0,0.9); margin-bottom: 6px; }
  h1 {
    color: #e8c874; font-size: 112px; font-weight: 600; letter-spacing: 5px; font-variant: small-caps; line-height: 1;
    text-shadow: 0 3px 10px rgba(0,0,0,0.95), 0 0 45px rgba(232, 200, 116, 0.28);
  }
  .tagline { margin-top: 16px; color: #f0e4c8; font-size: 40px; font-style: italic; text-shadow: 0 2px 8px rgba(0,0,0,0.95); }
  .features { margin-top: 18px; color: #cdb27a; font-size: 28px; font-variant: small-caps; letter-spacing: 2px; text-shadow: 0 2px 6px rgba(0,0,0,0.95); }
  .features .dot { color: #8a7448; padding: 0 9px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="art"></div>
    <div class="shade"></div>
    <div class="frame"></div>
    <div class="titleblock">
      <div class="ornament">✦ ✦ ✦</div>
      <h1>Smart Steward</h1>
      <div class="tagline">Your steward, finally doing the steward's job.</div>
      <div class="features">food <span class="dot">·</span> horses <span class="dot">·</span> troops <span class="dot">·</span> prisoners <span class="dot">·</span> loot</div>
    </div>
  </div>
</body>
</html>
